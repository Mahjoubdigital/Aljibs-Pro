<!DOCTYPE html>
<html lang="es" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Aljibs Pro - Instalación profesional de decoración en yeso en Tánger: techos, molduras, cornisas, rosetones y luz LED.">
<title>Aljibs Pro | Decoración en Yeso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0d2137; --navy2:#13304f; --gold:#c9a24b; --gold2:#e6c87a;
  --cream:#faf7f0; --ink:#253441; --white:#ffffff; --shadow:0 10px 30px rgba(13,33,55,.12);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Montserrat',sans-serif;background:var(--cream);color:var(--ink);line-height:1.6;overflow-x:hidden}
html[lang="ar"] body{font-family:'Cairo',sans-serif}
img{max-width:100%;display:block}
a{text-decoration:none;color:inherit}
section{padding:80px 20px;scroll-margin-top:90px}
.wrap{max-width:1150px;margin:auto}
h1,h2,h3{color:var(--navy);line-height:1.25}
h2{font-size:clamp(1.6rem,4vw,2.4rem);margin-bottom:10px}
.sec-sub{color:#68788a;margin-bottom:45px}
.gold-line{width:70px;height:4px;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:4px;margin:14px 0 18px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 28px;border-radius:50px;font-weight:700;border:none;cursor:pointer;transition:.3s;font-size:.95rem}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--navy);box-shadow:0 6px 18px rgba(201,162,75,.4)}
.btn-gold:hover{transform:translateY(-3px)}
.btn-out{border:2px solid var(--navy);color:var(--navy);background:transparent}
.btn-out:hover{background:var(--navy);color:var(--gold2)}
.btn-wa{background:#25D366;color:#fff;box-shadow:0 6px 18px rgba(37,211,102,.35)}
.btn-wa:hover{transform:translateY(-3px);background:#1ebe5d}

/* HEADER */
header{position:sticky;top:0;z-index:100;background:rgba(13,33,55,.96);backdrop-filter:blur(8px);box-shadow:0 2px 20px rgba(0,0,0,.25)}
.nav{max-width:1150px;margin:auto;display:flex;align-items:center;gap:20px;padding:10px 20px}
.brand{display:flex;align-items:center;gap:12px;margin-inline-end:auto}
.brand img{width:52px;height:52px;border-radius:50%;border:2px solid var(--gold);object-fit:cover}
.brand-name{color:var(--gold2);font-weight:800;font-size:1.15rem;line-height:1.2}
.brand-tag{color:#9fb2c8;font-size:.7rem;letter-spacing:1px;text-transform:uppercase}
.nav-links{display:flex;gap:26px;align-items:center}
.nav-links a{color:#dfe8f2;font-weight:600;font-size:.92rem;position:relative;padding:6px 0}
.nav-links a::after{content:"";position:absolute;bottom:0;inset-inline-start:0;width:0;height:2px;background:var(--gold);transition:.3s}
.nav-links a:hover::after{width:100%}
.nav-links a:hover{color:var(--gold2)}

/* ✅ BOTÓN PRESUPUESTO — PRIORIDAD CSS CORREGIDA + ESPACIO OPTIMIZADO */
.nav-links a.nav-quote{display:inline-flex;align-items:center;gap:6px;background:#25D366;color:#fff;padding:8px 14px;border-radius:50px;font-weight:700;font-size:.8rem;transition:.3s;white-space:nowrap;box-shadow:0 4px 12px rgba(37,211,102,.3)}
.nav-links a.nav-quote::after{content:none}
.nav-links a.nav-quote:hover{background:#1ebe5d;color:#fff;transform:translateY(-2px)}
.nav-quote svg{width:16px;height:16px;fill:#fff;flex-shrink:0}

#burger{display:none;background:none;border:none;cursor:pointer;flex-direction:column;gap:5px}
#burger span{width:26px;height:3px;background:var(--gold2);border-radius:3px}

/* MENÚ DESLIZANTE DE IDIOMAS */
.langs{position:relative}
.lang-trigger{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border:1px solid rgba(201,162,75,.35);border-radius:50px;padding:7px 13px;cursor:pointer;transition:.3s}
.lang-trigger:hover{border-color:var(--gold)}
.lang-trigger img{width:26px;height:19px;border-radius:3px;object-fit:cover;box-shadow:0 0 0 1px rgba(255,255,255,.25)}
.lang-trigger .caret{color:var(--gold2);font-size:.65rem;transition:.3s}
.langs.open .caret{transform:rotate(180deg)}
.lang-menu{position:absolute;top:calc(100% + 10px);inset-inline-end:0;min-width:170px;background:var(--navy2);border:1px solid rgba(201,162,75,.45);border-radius:14px;box-shadow:0 15px 40px rgba(0,0,0,.45);overflow:hidden;display:flex;flex-direction:column;opacity:0;transform:translateY(-14px);pointer-events:none;transition:.3s ease;z-index:120}
.langs.open .lang-menu{opacity:1;transform:translateY(0);pointer-events:auto}
.lang-menu button{display:flex;align-items:center;gap:10px;padding:11px 16px;background:none;border:none;color:#dfe8f2;font-weight:600;font-size:.85rem;cursor:pointer;transition:.25s;text-align:start}
.lang-menu button img{width:26px;height:19px;border-radius:3px;object-fit:cover}
.lang-menu button:hover{background:rgba(201,162,75,.15);color:var(--gold2);padding-inline-start:22px}
.lang-menu button.active{background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--navy)}

/* HERO */
.hero{background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;padding:90px 20px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 85% 20%,rgba(201,162,75,.15),transparent 45%),radial-gradient(circle at 10% 90%,rgba(201,162,75,.1),transparent 40%)}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:50px;align-items:center;position:relative}
.hero-badge{display:inline-block;background:rgba(201,162,75,.15);border:1px solid var(--gold);color:var(--gold2);padding:7px 18px;border-radius:50px;font-size:.8rem;font-weight:700;margin-bottom:20px}
.hero h1{color:#fff;font-size:clamp(1.9rem,4.5vw,3rem);margin-bottom:18px}
.hero h1 em{color:var(--gold2);font-style:normal}
.hero p{color:#c4d2e2;font-size:1.05rem;margin-bottom:32px;max-width:520px}
.hero-cta{display:flex;gap:14px;flex-wrap:wrap}
.hero-img{position:relative}
.hero-img img{border-radius:18px;border:3px solid var(--gold);box-shadow:0 25px 60px rgba(0,0,0,.45);aspect-ratio:1;object-fit:cover;width:100%}
.hero-img::after{content:"";position:absolute;inset:-16px;border:2px dashed rgba(201,162,75,.5);border-radius:24px;z-index:-1}
.stats{display:flex;gap:40px;margin-top:45px;flex-wrap:wrap}
.stat b{display:block;font-size:1.7rem;color:var(--gold2)}
.stat span{color:#9fb2c8;font-size:.82rem}

/* SERVICIOS */
.srv-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:26px}
.srv{background:#fff;border-radius:16px;padding:32px 26px;box-shadow:var(--shadow);border-top:4px solid transparent;transition:.35s;position:relative;overflow:hidden}
.srv:hover{transform:translateY(-8px);border-top-color:var(--gold)}
.srv .ico{width:58px;height:58px;border-radius:14px;background:linear-gradient(135deg,var(--navy),var(--navy2));display:flex;align-items:center;justify-content:center;font-size:1.6rem;margin-bottom:18px}
.srv h3{margin-bottom:8px;font-size:1.1rem}
.srv p{color:#68788a;font-size:.92rem}

/* GALERÍA */
#gallery{background:#fff}
.gal-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px;margin-bottom:60px}
.gal{position:relative;border-radius:16px;overflow:hidden;cursor:pointer;box-shadow:var(--shadow)}
.gal img{width:100%;aspect-ratio:1;object-fit:cover;transition:.5s}
.gal:hover img{transform:scale(1.07)}
.gal figcaption{position:absolute;inset-inline:0;bottom:0;background:linear-gradient(transparent,rgba(13,33,55,.92));color:#fff;padding:40px 18px 16px;font-weight:600;font-size:.92rem}
.gal .zoom{position:absolute;top:12px;inset-inline-end:12px;background:rgba(201,162,75,.9);color:var(--navy);width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800}
.ba-box h3{font-size:1.3rem;margin-bottom:6px}
.ba{--pos:50%;position:relative;border-radius:16px;overflow:hidden;box-shadow:var(--shadow);aspect-ratio:16/9;max-height:520px;user-select:none}
.ba img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ba .after{clip-path:inset(0 0 0 var(--pos))}
.ba-line{position:absolute;top:0;bottom:0;left:var(--pos);width:3px;background:var(--gold);z-index:3}
.ba-handle{position:absolute;top:50%;left:var(--pos);transform:translate(-50%,-50%);width:46px;height:46px;border-radius:50%;background:var(--gold);color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:800;z-index:4;box-shadow:0 4px 14px rgba(0,0,0,.35);pointer-events:none}
.ba input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;z-index:5}
.ba-tag{position:absolute;top:14px;padding:5px 14px;border-radius:50px;font-size:.78rem;font-weight:700;z-index:2}
.ba-tag.b{inset-inline-start:14px;background:rgba(13,33,55,.8);color:#fff}
.ba-tag.a{inset-inline-end:14px;background:rgba(201,162,75,.9);color:var(--navy)}

/* BANNER PROMO */
#promo{padding:40px 20px}
.promo-link{display:block;transition:.3s}
.promo-link:hover{transform:translateY(-5px)}
.promo-link img{width:100%;border-radius:20px;border:3px solid var(--gold);box-shadow:0 20px 50px rgba(13,33,55,.25);object-fit:cover}

/* POR QUÉ NOSOTROS */
#about{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#c4d2e2}
#about h2{color:#fff}
#about .sec-sub{color:#9fb2c8}
#about p{margin-bottom:16px;max-width:800px}
#about strong{color:var(--gold2)}
.why{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:22px;margin-top:40px}
.why-item{background:rgba(255,255,255,.06);border:1px solid rgba(201,162,75,.35);border-radius:14px;padding:26px 20px;text-align:center;transition:.3s}
.why-item:hover{background:rgba(201,162,75,.12);transform:translateY(-5px)}
.why-item .e{font-size:1.9rem;margin-bottom:10px}
.why-item h3{color:var(--gold2);font-size:1rem;margin-bottom:6px}
.why-item p{font-size:.85rem;color:#9fb2c8;margin:0}

/* CONTACTO */
.contact-card{background:#fff;border-radius:20px;box-shadow:var(--shadow);padding:50px 30px;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:30px;text-align:center;border-top:5px solid var(--gold)}
.c-item .e{font-size:2.2rem;margin-bottom:10px}
.c-item h3{font-size:1rem;margin-bottom:6px}
.c-item p{color:#68788a;font-size:.92rem;margin-bottom:14px}
.c-item .big{font-size:1.25rem;font-weight:800;color:var(--navy);direction:ltr}
.contact-btns{display:flex;gap:14px;justify-content:center;margin-top:40px;flex-wrap:wrap}

/* FOOTER */
footer{background:var(--navy);color:#9fb2c8;text-align:center;padding:30px 20px;font-size:.85rem}
footer b{color:var(--gold2)}

/* CHAT */
#chatBtn{position:fixed;bottom:22px;inset-inline-end:22px;z-index:90;width:62px;height:62px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold2));border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.7rem;box-shadow:0 8px 25px rgba(201,162,75,.5);transition:.3s}
#chatBtn:hover{transform:scale(1.08)}
#chatBox{position:fixed;bottom:96px;inset-inline-end:22px;z-index:95;width:min(370px,calc(100vw - 44px));height:520px;max-height:70vh;background:#fff;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.3);display:flex;flex-direction:column;overflow:hidden;transform:translateY(20px);opacity:0;pointer-events:none;transition:.35s}
#chatBox.open{transform:translateY(0);opacity:1;pointer-events:auto}
.chat-head{background:linear-gradient(135deg,var(--navy),var(--navy2));padding:14px 16px;display:flex;align-items:center;gap:12px}
.chat-head img{width:42px;height:42px;border-radius:50%;border:2px solid var(--gold);object-fit:cover}
.chat-head b{color:var(--gold2);display:block;font-size:.95rem}
.chat-head small{color:#8fdc9a;font-size:.72rem}
.chat-head small::before{content:"●";margin-inline-end:5px}
#chatClose{margin-inline-start:auto;background:none;border:none;color:#c4d2e2;font-size:1.3rem;cursor:pointer}
#chatMsgs{flex:1;overflow-y:auto;padding:16px;background:#f4f1ea;display:flex;flex-direction:column;gap:10px}
.msg{max-width:82%;padding:10px 14px;border-radius:14px;font-size:.88rem;line-height:1.5;animation:pop .3s}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.msg.bot{background:#fff;border-start-start-radius:4px;box-shadow:0 2px 8px rgba(0,0,0,.08);align-self:flex-start}
.msg.user{background:var(--navy);color:#fff;border-start-end-radius:4px;align-self:flex-end}
.msg.typing span{display:inline-block;width:7px;height:7px;border-radius:50%;background:#9aa8b8;margin-inline-end:3px;animation:blink 1s infinite}
.msg.typing span:nth-child(2){animation-delay:.2s}.msg.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}
#chips{display:flex;flex-wrap:wrap;gap:7px;padding:10px 12px;background:#f4f1ea;border-top:1px solid #e5e0d5}
#chips button{border:1.5px solid var(--gold);background:#fff;color:var(--navy);border-radius:50px;padding:6px 14px;font-size:.78rem;font-weight:700;cursor:pointer;transition:.25s}
#chips button:hover{background:var(--gold);color:#fff}
.chat-foot{display:flex;gap:8px;padding:10px;background:#fff;border-top:1px solid #eee}
.chat-foot input{flex:1;border:1.5px solid #e2ddd2;border-radius:50px;padding:11px 16px;font-size:.9rem;outline:none;font-family:inherit}
.chat-foot input:focus{border-color:var(--gold)}
.chat-foot button{width:46px;height:46px;border-radius:50%;border:none;background:var(--navy);color:var(--gold2);font-size:1.1rem;cursor:pointer;flex-shrink:0}
html[dir="rtl"] .chat-foot button{transform:scaleX(-1)}

/* LIGHTBOX */
#lightbox{position:fixed;inset:0;background:rgba(13,33,55,.92);z-index:200;display:none;align-items:center;justify-content:center;flex-direction:column;padding:20px}
#lightbox.open{display:flex}
#lightbox img{max-width:min(90vw,700px);max-height:75vh;border-radius:14px;border:3px solid var(--gold)}
#lightbox p{color:var(--gold2);margin-top:14px;font-weight:700}
#lbClose{position:absolute;top:18px;inset-inline-end:22px;background:none;border:none;color:#fff;font-size:2rem;cursor:pointer}

/* ✅ PANTALLAS MEDIANAS: header despejado + botón compacto */
@media(max-width:1100px){
  .nav{gap:12px}
  .nav-links{gap:16px}
  .brand-tag{display:none}
  .brand-name{font-size:1rem}
  .nav-links a.nav-quote{padding:7px 12px;font-size:.75rem}
  .nav-quote svg{width:15px;height:15px}
}

@media(max-width:900px){
  .hero .wrap{grid-template-columns:1fr}
  .hero-img{max-width:440px;margin:auto}
  #burger{display:flex}
  .nav-links{position:absolute;top:100%;inset-inline:0;background:var(--navy);flex-direction:column;gap:0;padding:10px 20px 20px;display:none}
  .nav-links.open{display:flex}
  .nav-links a{padding:12px 0;border-bottom:1px solid rgba(255,255,255,.08);width:100%;text-align:center}
  .nav-links a.nav-quote{width:100%;justify-content:center;margin-top:10px;padding:12px 16px;font-size:.9rem}
  .nav-quote svg{width:18px;height:18px}
}
.reveal{opacity:0;transform:translateY(30px);transition:.7s}
.reveal.vis{opacity:1;transform:none}
</style>
</head>
<body>

<header>
  <div class="nav">
    <div class="brand">
      <img src="https://i.postimg.cc/wBdRbFgf/logo.jpg" alt="Aljibs Pro" data-fallback="logo">
      <div>
        <div class="brand-name">الجبس برو · Aljibs Pro</div>
        <div class="brand-tag" data-i18n="brand_tag"></div>
      </div>
    </div>
    <nav class="nav-links" id="navLinks">
      <a href="#hero"     data-i18n="nav_home"></a>
      <a href="#services" data-i18n="nav_services"></a>
      <a href="#gallery"  data-i18n="nav_gallery"></a>
      <a href="#about"    data-i18n="nav_about"></a>
      <a href="#contact"  data-i18n="nav_contact"></a>
      <a href="https://wa.me/212632599085" target="_blank" class="nav-quote">

        <span data-i18n="nav_quote"></span>
      </a>

    <div class="langs" id="langs">
      <button class="lang-trigger" id="langTrigger" aria-label="Idioma / Language">
        <img id="langFlag" src="https://flagcdn.com/24x18/es.png" alt="idioma">
        <span class="caret">▼</span>
      </button>
      <div class="lang-menu">
        <button data-lang="es"><img src="https://flagcdn.com/24x18/es.png" alt="">Español</button>
        <button data-lang="fr"><img src="https://flagcdn.com/24x18/fr.png" alt="">Français</button>
        <button data-lang="en"><img src="https://flagcdn.com/24x18/gb.png" alt="">English</button>
        <button data-lang="ar"><img src="https://flagcdn.com/24x18/ma.png" alt="">العربية</button>
      </div>
    </div>

    <button id="burger" aria-label="menu"><span></span><span></span><span></span></button>
  </div>
</header>

<section class="hero" id="hero">
  <div class="wrap">
    <div>
      <span class="hero-badge" data-i18n="hero_badge"></span>
      <h1 data-i18n="hero_title"></h1>
      <p data-i18n="hero_sub"></p>
      <div class="hero-cta">
        <a class="btn btn-gold" href="#contact" data-i18n="cta_quote"></a>
        <a class="btn btn-out" style="border-color:var(--gold2);color:var(--gold2)" href="#gallery" data-i18n="cta_gallery"></a>
      </div>
      <div class="stats">
        <div class="stat"><b>+500</b><span data-i18n="stat1"></span></div>
        <div class="stat"><b>15</b><span data-i18n="stat2"></span></div>
        <div class="stat"><b>100%</b><span data-i18n="stat3"></span></div>
      </div>
    </div>
    <div class="hero-img">
      <img src="https://i.postimg.cc/PqkvFKTb/Despues.webp" alt="Techo decorado en yeso" data-fallback="ph">
    </div>
  </div>
</section>

<section id="services">
  <div class="wrap">
    <h2 data-i18n="services_title"></h2>
    <div class="gold-line"></div>
    <p class="sec-sub" data-i18n="services_sub"></p>
    <div class="srv-grid">
      <div class="srv reveal"><div class="ico">🏛️</div><h3 data-i18n="s1t"></h3><p data-i18n="s1d"></p></div>
      <div class="srv reveal"><div class="ico">✨</div><h3 data-i18n="s2t"></h3><p data-i18n="s2d"></p></div>
      <div class="srv reveal"><div class="ico">💡</div><h3 data-i18n="s3t"></h3><p data-i18n="s3d"></p></div>
      <div class="srv reveal"><div class="ico">🧱</div><h3 data-i18n="s4t"></h3><p data-i18n="s4d"></p></div>

let lang = localStorage.getItem("lang") || "es";
function applyLang(l){
  lang = l; localStorage.setItem("lang", l);
  document.documentElement.lang = l;
  document.documentElement.dir = (l === "ar") ? "rtl" : "ltr";
  document.title = T[l]._title;
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const k = el.dataset.i18n; if(T[l][k] !== undefined) el.innerHTML = T[l][k];
  });
  document.querySelectorAll("[data-i18n-ph]").forEach(el=>{
    el.placeholder = T[l][el.dataset.i18nPh];
  });
  document.querySelectorAll("#langs .lang-menu button").forEach(b=>b.classList.toggle("active", b.dataset.lang===l));
  document.getElementById("langFlag").src = "https://flagcdn.com/24x18/" + FLAG[l] + ".png";
  renderChips();
  if(chatMsgs.children.length === 1) chatMsgs.firstChild.innerHTML = T[l].chat_welcome;
}

document.getElementById("langTrigger").addEventListener("click", e=>{
  e.stopPropagation();
  document.getElementById("langs").classList.toggle("open");
});
document.getElementById("langs").addEventListener("click", e=>{
  const b = e.target.closest("button[data-lang]");
  if(b){ applyLang(b.dataset.lang); document.getElementById("langs").classList.remove("open"); }
});
document.addEventListener("click", e=>{
  if(!e.target.closest("#langs")) document.getElementById("langs").classList.remove("open");
});

const io = new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){e.target.classList.add("vis"); io.unobserve(e.target);} }),{threshold:.15});
document.querySelectorAll(".reveal").forEach(el=>io.observe(el));

const chatBox = document.getElementById("chatBox"), chatMsgs = document.getElementById("chatMsgs");
let opened = false;
chatBtn.onclick = ()=>{ chatBox.classList.toggle("open"); if(!opened){ opened=true; addMsg(T[lang].chat_welcome,"bot"); } };
chatClose.onclick = ()=> chatBox.classList.remove("open");

function renderChips(){
  chips.innerHTML = "";
  T[lang].chips.forEach(c=>{
    const b = document.createElement("button"); b.textContent = c;
    b.onclick = ()=> sendMsg(c); chips.appendChild(b);
  });
}
function addMsg(html, who){
  const d = document.createElement("div");
  d.className = "msg " + who; d.innerHTML = html;
  chatMsgs.appendChild(d); chatMsgs.scrollTop = chatMsgs.scrollHeight;
  return d;
}
function norm(s){
  s = s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  s = s.replace(/[\u064B-\u0652\u0640]/g,"").replace(/[أإآ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه");
  return s;
}
function botReply(text){
  const n = norm(text);
  for(const it of INTENTS){
    for(const k of it.k){
      const kk = norm(k);
      if(kk.length <= 4){ if(new RegExp("(^|\\s)"+kk+"(\\s|$)").test(n)) return it.r[lang]; }
      else if(n.includes(kk)) return it.r[lang];
    }
  }
  return FALLBACK[lang];
}
function sendMsg(text){
  addMsg(text.replace(/</g,"&lt;"),"user");
  const t = addMsg("<span></span><span></span><span></span>","bot typing");
  setTimeout(()=>{ t.remove(); addMsg(botReply(text),"bot"); }, 700 + Math.random()*600);
}
chatSend.onclick = ()=>{ const v = chatIn.value.trim(); if(v){ chatIn.value=""; sendMsg(v);} };
chatIn.addEventListener("keydown", e=>{ if(e.key==="Enter") chatSend.click(); });
